# Layered on top of detekt's defaults (buildUponDefaultConfig = true), so only the
# deviations appear here.
#
# Every finding detekt raised was looked at individually. Where a real improvement existed
# it was made rather than configured away:
#
#   - ClassSpec.emit: the constructor block became emitConstructor + emitParameterProperty.
#     110 lines / complexity 26 -> 64 / 19.
#   - FunctionSpec.emitSignature: became emitName + emitReturnType. Complexity 17 -> clear.
#   - FileSpec.emit and ModuleSpec.emit carried the same member `when` separately and had
#     already drifted apart; both now call a shared CodeWriter.emitMember. Complexity 17 and
#     15 -> clear, and an ExportSpec inside a namespace no longer throws.
#   - FunctionSpec's five-way body-less test became a named isDeclarationOnly.
#   - ParameterSpec's `size < 5` became MAX_PARAMETERS_ON_ONE_LINE.
#
# What is left is relaxed because the rule is measuring the design, not a defect:
#
#   - TooManyFunctions fires on eight builders and TypeName's companion. A builder has one
#     method per feature of the thing it builds, and the companion is the factory for every
#     type TypeScript has. Splitting either would make the API worse to use.
#   - The remaining complex methods are dispatch tables. CodeWriter.emitCode is a `when` over
#     format placeholders; breaking it into per-placeholder functions replaces one readable
#     table with indirection.
#
# Thresholds are round numbers set comfortably above the current worst case, not just above
# it: 100 lines against a worst of 68, complexity 25 against 19, 40 functions against 35. If
# new code needs them raised, that is a signal worth reading rather than a number to bump.
#
# Narrower findings are suppressed at the single site with a reason, so the rule keeps
# working everywhere else -- see NestedBlockDepth and LoopWithTooManyJumpStatements in
# CodeWriter, FileSpec, CodeBlock and Utils.

complexity:
  LongMethod:
    allowedLines: 100
  CyclomaticComplexMethod:
    allowedComplexity: 25
  TooManyFunctions:
    allowedFunctionsPerFile: 40
    allowedFunctionsPerClass: 40
    allowedFunctionsPerInterface: 40
    allowedFunctionsPerObject: 40
    allowedFunctionsPerEnum: 40

style:
  # Off by preference, not by threshold. An early return per failed check reads better than
  # nesting the success path inside a long conditional, so counting returns measures the
  # style this project wants rather than a problem with it.
  ReturnCount:
    active: false
  # ktlint already enforces 120 columns through Spotless; two tools reporting the same thing
  # means fixing it twice.
  MaxLineLength:
    active: false

naming:
  # Utils.kt is a deliberate grab-bag of top-level helpers, not a single-declaration file.
  MatchingDeclarationName:
    active: false
