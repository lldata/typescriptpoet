# Layered on top of detekt's defaults (buildUponDefaultConfig = true), so only the
# deviations appear here.
#
# The theme of these relaxations: this is a code generator. Its shape is a handful of large
# `emit` methods that walk a spec and write syntax, plus builder classes with one method per
# thing the generated construct can carry. Both are the design rather than debt, and the
# project reached the same conclusion years ago: the .codebeatsettings it used to carry
# raised exactly these thresholds (ARITY, ABC, TOO_MANY_METHODS). detekt replaces codebeat,
# whose badge had been dead for years, so that file is gone and this one is the single
# place static-analysis thresholds are set.
#
# Only three rules are relaxed globally, and only because they fire across five to nine
# sites each and describe the architecture rather than any one method. Everything else that
# fired was either fixed in the code or suppressed at the single site with a reason, so the
# rule keeps working everywhere else -- a global threshold is a blind spot, not a fix.
#
# The thresholds below carry deliberate headroom over the current worst case (110/26/35), so
# they are a ceiling rather than a line drawn under the existing code. If a new method needs
# them raised again, that is a signal worth reading, not a number to bump.

complexity:
  # ClassSpec.emit is 110 lines of "write the class, then its properties, then its
  # constructor, then its methods". Splitting it would scatter the emission order.
  LongMethod:
    allowedLines: 120
  CyclomaticComplexMethod:
    allowedComplexity: 30
  # Builders expose one method per feature of the construct they build, and TypeName's
  # companion is the factory for every type the language has: 35 and counting.
  TooManyFunctions:
    allowedFunctionsPerFile: 40
    allowedFunctionsPerClass: 40
    allowedFunctionsPerInterface: 40
    allowedFunctionsPerObject: 40
    allowedFunctionsPerEnum: 40

style:
  # Off by preference, not by threshold. An early return per failed check reads better than
  # nesting the success path inside a long conditional, so counting returns measures the
  # style this project wants rather than a problem with it.
  ReturnCount:
    active: false
  # ktlint already enforces 120 columns through Spotless; two tools reporting the same thing
  # means fixing it twice.
  MaxLineLength:
    active: false

naming:
  # Utils.kt is a deliberate grab-bag of top-level helpers, not a single-declaration file.
  MatchingDeclarationName:
    active: false
