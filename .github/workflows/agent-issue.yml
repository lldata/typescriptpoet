name: Agent — work an issue

# A new issue from a trusted author is a work order: the agent implements it and opens a pull
# request. An issue from anyone else stops at the authorisation job, which records why in the
# run's annotations rather than failing.
#
# GitHub applies a second gate of its own before this ever matters: claude-code-action rejects
# issue events from users without write access, so an untrusted author cannot start a run at
# all. The trusted list is the narrower rule inside that.

on:
  issues:
    types: [opened]
  # Re-run the agent on an issue by hand, after editing it or after a failed attempt.
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to work
        required: true

permissions: {}

# Shared with the sweep in agent-tend.yml. Two runs that can both push branches and comment
# must not overlap, or they pick the same work and race each other. The cost is that a second
# issue filed while one is being worked waits its turn, which is the right trade.
concurrency:
  group: agent-write
  cancel-in-progress: false

jobs:

  authorise:
    runs-on: ubuntu-latest

    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
      issue: ${{ steps.check.outputs.issue }}

    steps:

    - uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - id: check
      env:
        AUTHOR: ${{ github.event.issue.user.login || github.actor }}
        ISSUE: ${{ github.event.issue.number || inputs.issue }}
      run: |
        echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
        # Fail closed on an empty author: `grep -qxF ""` matches every line, so an
        # unset login would otherwise come out trusted.
        if [ -z "$AUTHOR" ]; then
          echo "trusted=false" >> "$GITHUB_OUTPUT"
          echo "::error::No issue author resolved; refusing to run."
          exit 0
        fi
        if grep -qxF "$AUTHOR" .github/trusted-authors; then
          echo "trusted=true" >> "$GITHUB_OUTPUT"
          echo "::notice::$AUTHOR is trusted; working issue #$ISSUE."
        else
          echo "trusted=false" >> "$GITHUB_OUTPUT"
          echo "::notice::$AUTHOR is not in .github/trusted-authors; no pull request will be opened."
        fi

  work:
    needs: [ authorise ]
    if: needs.authorise.outputs.trusted == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:

    - uses: actions/checkout@v6

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # The kitchen sink is type-checked with real tsc and Prettier through npx. Without Node
    # those two checks quietly skip, and a green build would prove less than it appears to.
    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - uses: gradle/actions/setup-gradle@v4

    # 80 turns was not enough for a change that has to build to learn anything: the run on
    # issue #21 spent all of them in seven minutes and was discarded whole. A turn here is
    # often a Gradle build, so the ceiling has to be generous; `timeout-minutes` on the job
    # is the real backstop against a run that goes nowhere.
    - id: agent
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        prompt: "/work-issue ${{ needs.authorise.outputs.issue }}"
        claude_args: |
          --max-turns 200
          --permission-mode acceptEdits
          --allowedTools "Read,Write,Edit,Grep,Glob,Bash"

    # The run log records what the agent *did* — every tool call — but never what it decided or
    # why. When a run ends green having produced nothing, the log is silent about the only
    # question worth asking. This keeps the transcript so that question can be answered; two
    # runs on #27 were unexplainable without it.
    - name: Keep the agent's transcript
      if: always() && steps.agent.outputs.execution_file != ''
      uses: actions/upload-artifact@v4
      with:
        name: transcript-issue-${{ needs.authorise.outputs.issue }}-${{ github.run_id }}
        path: ${{ steps.agent.outputs.execution_file }}
        retention-days: 30
        if-no-files-found: warn

    # A run that finishes green without saying anything is indistinguishable from a run that
    # never happened, and that is the property which makes an agent impossible to trust when
    # nobody is watching. Two runs ended exactly this way — successful, silent, no branch and
    # no comment — before this step existed. The skills tell the agent to leave a trace; this
    # is what happens when it does not.
    - name: Make sure the run left a trace
      if: success()
      env:
        GH_TOKEN: ${{ github.token }}
        ISSUE: ${{ needs.authorise.outputs.issue }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        # Only what this run produced counts: an older comment from a previous attempt is not
        # this run answering the issue.
        started=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json createdAt --jq .createdAt)

        said=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json comments \
          --jq "[.comments[] | select(.author.login == \"claude\" and .createdAt > \"$started\")] | length")

        built=$(gh api "/repos/$GITHUB_REPOSITORY/branches" --paginate \
          --jq "[.[] | select(.name | startswith(\"agent/issue-$ISSUE-\"))] | length")

        if [ "$said" -gt 0 ] || [ "$built" -gt 0 ]; then
          echo "::notice::Run left $said comment(s) and $built branch(es)."
          exit 0
        fi

        echo "::warning::The run finished without leaving a comment or a branch."
        gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "The agent's run on this issue finished without reaching a conclusion — no comment, no branch, no pull request. See [the run log]($RUN_URL).

        This note is from the workflow rather than from the agent, so it cannot say why. It exists because a silent success and a broken agent look identical from the outside, and they should not.

        The issue is still open and unanswered. Retry with: gh workflow run agent-issue.yml -f issue=$ISSUE"

    # A failed run is otherwise invisible. The work is lost, nothing is pushed, and the issue
    # looks exactly as it did before — which reads as "nobody has looked at this yet" rather
    # than "an attempt was made and died". Say so on the issue itself, since that is where
    # someone is looking.
    - name: Say on the issue that the run failed
      if: failure()
      env:
        GH_TOKEN: ${{ github.token }}
        ISSUE: ${{ needs.authorise.outputs.issue }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "The agent's run on this issue failed and left nothing behind — no branch, no pull request. See [the run log]($RUN_URL).

        This note is from the workflow rather than from the agent, so it says only that the attempt did not finish. It is not a judgment about the issue itself, which is still open and unanswered.

        Retry with: gh workflow run agent-issue.yml -f issue=$ISSUE"
