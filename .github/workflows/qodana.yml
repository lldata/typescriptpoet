name: Qodana

# IntelliJ inspections are what the IDE shows and what neither the Kotlin CLI compiler nor
# detekt reports, so they are otherwise invisible outside an editor.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:


# Runs for the same ref queue rather than pile up. cancel-in-progress only for pull
# requests: on main every commit should keep its own verified result, so a rapid second
# push queues behind the first instead of cancelling it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qodana:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Qodana Scan
      uses: JetBrains/qodana-action@v2026.2.0
      with:
        # No baseline: it would report zero while hiding the findings. No token either --
        # the scan and its SARIF work without one; a token only adds cloud reporting.
        pr-mode: false
        use-caches: true

    - name: Upload to code scanning
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
