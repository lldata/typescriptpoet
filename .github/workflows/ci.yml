name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The Gradle toolchain pins compilation to JDK 17; this matrix checks the build
        # itself runs on each supported JDK.
        java: [ '17', '21', '25' ]

    steps:

    - uses: actions/checkout@v5

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}

    - uses: gradle/actions/setup-gradle@v4

    - name: Build & Test
      run: ./gradlew build

    - name: Upload Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reports-jdk${{ matrix.java }}
        path: build/reports


  publish-snapshot:
    runs-on: ubuntu-latest

    needs: [ build-test ]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

    - uses: actions/checkout@v5

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: gradle/actions/setup-gradle@v4

    - name: Publish Maven (Snapshot)
      run: >-
        ./gradlew publishMavenRelease
        -PossrhUsername=${{ secrets.OSSRH_USER }}
        -PossrhPassword=${{ secrets.OSSRH_PASS }}

    - name: Build Documentation
      run: ./gradlew dokkaGeneratePublicationHtml

    - name: Publish Documentation
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        clean: false
        folder: build/javadoc
