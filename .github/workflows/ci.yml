name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Lets the workflow be started from the Actions tab without pushing a commit.
  workflow_dispatch:


# Runs for the same ref queue rather than pile up. cancel-in-progress only for pull
# requests: on main every commit should keep its own verified result, so a rapid second
# push queues behind the first instead of cancelling it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # Defaults to GitHub's hosted runners. A fork can point this at its own runner by
    # setting the CI_RUNNER repository variable (e.g. to `self-hosted`), without the
    # workflow itself hard-coding anything the upstream repository cannot use.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        # The Gradle toolchain pins compilation to JDK 17; this matrix checks the build
        # itself runs on each supported JDK.
        java: [ '17', '21', '25' ]

    steps:

    - uses: actions/checkout@v5

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}

    - uses: gradle/actions/setup-gradle@v4

    - name: Build & Test
      run: ./gradlew build

    - name: Coverage summary
      if: always() && matrix.java == '17'
      run: |
        python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import xml.etree.ElementTree as ET, pathlib
        report = pathlib.Path('build/reports/jacoco/test/jacocoTestReport.xml')
        if not report.exists():
            print('No coverage report was produced.')
            raise SystemExit
        root = ET.parse(report).getroot()
        print('### Coverage\n')
        print('| Counter | Covered | Total | % |')
        print('| --- | ---: | ---: | ---: |')
        for counter in root.findall('counter'):
            missed, covered = int(counter.get('missed')), int(counter.get('covered'))
            total = missed + covered
            print(f"| {counter.get('type').title()} | {covered} | {total} | {100 * covered / total:.1f}% |")
        PY

    - name: Upload Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reports-jdk${{ matrix.java }}
        path: build/reports


  publish-snapshot:
    runs-on: ubuntu-latest

    needs: [ build-test ]

    # Only the canonical repository holds the publishing secrets; forks would fail here.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && github.repository == 'outfoxx/typescriptpoet'

    steps:

    - uses: actions/checkout@v5

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: gradle/actions/setup-gradle@v4

    - name: Publish Maven (Snapshot)
      run: >-
        ./gradlew publishMavenRelease
        -PossrhUsername=${{ secrets.OSSRH_USER }}
        -PossrhPassword=${{ secrets.OSSRH_PASS }}

    - name: Build Documentation
      run: ./gradlew dokkaGeneratePublicationHtml

    - name: Publish Documentation
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        clean: false
        folder: build/javadoc
