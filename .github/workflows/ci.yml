name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Lets the workflow be started from the Actions tab without pushing a commit.
  workflow_dispatch:


# Runs for the same ref queue rather than pile up. cancel-in-progress only for pull
# requests: on main every commit should keep its own verified result, so a rapid second
# push queues behind the first instead of cancelling it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # Defaults to GitHub's hosted runners. A fork can point this at its own runner by
    # setting the CI_RUNNER repository variable (e.g. to `self-hosted`), without the
    # workflow itself hard-coding anything the upstream repository cannot use.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        # The Gradle toolchain pins compilation to JDK 17; this matrix checks the build
        # itself runs on each supported JDK.
        java: [ '17', '21', '25' ]

    steps:

    - uses: actions/checkout@v5

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}

    - uses: gradle/actions/setup-gradle@v4

    - name: Build & Test
      run: ./gradlew build

    - name: Coverage summary
      if: always() && matrix.java == '17'
      run: |
        python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import xml.etree.ElementTree as ET, pathlib
        report = pathlib.Path('build/reports/jacoco/test/jacocoTestReport.xml')
        if not report.exists():
            print('No coverage report was produced.')
            raise SystemExit
        root = ET.parse(report).getroot()
        print('### Coverage\n')
        print('| Counter | Covered | Total | % |')
        print('| --- | ---: | ---: | ---: |')
        for counter in root.findall('counter'):
            missed, covered = int(counter.get('missed')), int(counter.get('covered'))
            total = missed + covered
            print(f"| {counter.get('type').title()} | {covered} | {total} | {100 * covered / total:.1f}% |")
        PY

    - name: Upload Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reports-jdk${{ matrix.java }}
        path: build/reports


  # Renders the shields.io endpoint the README's coverage badge reads. Kept in its own job
  # so that `contents: write` is scoped to a job that only ever runs on a push to main,
  # rather than granted to the job that also builds pull requests.
  coverage-badge:
    runs-on: ubuntu-latest

    needs: [ build-test ]

    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && github.repository == 'lldata/typescriptpoet'

    permissions:
      contents: write

    steps:

    # The deploy action operates on a git working directory, so the checkout is required
    # even though nothing here reads the source.
    - uses: actions/checkout@v5

    # Reuses the report build-test already produced rather than building again.
    - uses: actions/download-artifact@v4
      with:
        name: reports-jdk17
        path: reports

    - name: Render badge endpoint
      run: |
        mkdir -p badges
        python3 - <<'PY'
        import json, pathlib, xml.etree.ElementTree as ET
        root = ET.parse('reports/jacoco/test/jacocoTestReport.xml').getroot()
        counter = next(c for c in root.findall('counter') if c.get('type') == 'LINE')
        missed, covered = int(counter.get('missed')), int(counter.get('covered'))
        pct = 100 * covered / (missed + covered)
        # Yellow starts just above the 78% line floor in build.gradle.kts, so the badge
        # turns while there is still room before jacocoTestCoverageVerification fails
        # rather than at the same moment.
        color = (
            'brightgreen' if pct >= 90
            else 'green' if pct >= 80
            else 'yellow' if pct >= 75
            else 'orange'
        )
        pathlib.Path('badges/coverage.json').write_text(json.dumps({
            'schemaVersion': 1,
            'label': 'coverage',
            'message': f'{pct:.0f}%',
            'color': color,
        }))
        print(f'line coverage {pct:.1f}% -> {color}')
        PY

    # clean: false, because this branch also holds the Dokka documentation.
    - name: Publish badge endpoint
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        clean: false
        folder: badges
        target-folder: badges
