name: Publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+**"]

jobs:

  publish:
    runs-on: ubuntu-latest

    # Only the canonical repository holds the publishing secrets.
    if: github.repository == 'lldata/typescriptpoet'

    permissions:
      contents: write

    steps:

    - uses: actions/checkout@v5

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: gradle/actions/setup-gradle@v4

    - name: Resolve Version
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Build
      run: ./gradlew build -PreleaseVersion=${{ steps.version.outputs.version }}

    # Uploads to a staging repository; it does NOT release to Maven Central. A human
    # completes the release at https://central.sonatype.com/publishing, which is the
    # intended shape: publishing is irreversible and stays a deliberate human act.
    #
    # Every credential arrives as an environment variable. Passing them as `-P` flags puts
    # them in the runner's process table and in the echoed `Run` line of the log.
    - name: Publish Maven
      env:
        ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
        ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      run: >-
        ./gradlew publishMavenRelease
        -PreleaseVersion=${{ steps.version.outputs.version }}

    # The upload above lands in an *open* staging repository, and Sonatype only forwards a
    # repository to the Portal once it is closed — without this, a green run leaves the
    # artifacts somewhere nobody can see or release. The endpoint keys the default repository
    # by client IP, so this has to run on the same runner as the upload and cannot be done by
    # hand afterwards.
    #
    # No `publishing_type=automatic`: the deployment lands in the Portal awaiting a human,
    # which is the point. Publishing to Central is irreversible.
    - name: Close Staging Repository
      env:
        USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      run: |
        token=$(printf '%s:%s' "$USERNAME" "$PASSWORD" | base64 -w0)
        # Derived from two secrets, so it is not masked automatically.
        echo "::add-mask::$token"
        curl --fail-with-body -sS -X POST \
          -H "Authorization: Bearer $token" \
          "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/dk.lldata"

    - name: GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >-
        gh release create "$GITHUB_REF_NAME"
        --draft
        --title "🎉 ${{ steps.version.outputs.version }} Release"
        build/libs/*.jar

    - name: Build Documentation
      run: ./gradlew dokkaGeneratePublicationHtml -PreleaseVersion=${{ steps.version.outputs.version }}

    - name: Publish Documentation
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        clean: false
        folder: build/javadoc
