name: Publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+**"]

jobs:

  publish:
    runs-on: ubuntu-latest

    # Only the canonical repository holds the publishing secrets.
    if: github.repository == 'lldata/typescriptpoet'

    permissions:
      contents: write

    steps:

    - uses: actions/checkout@v5

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: gradle/actions/setup-gradle@v4

    - name: Resolve Version
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Build
      run: ./gradlew build -PreleaseVersion=${{ steps.version.outputs.version }}

    # Uploads a bundle to the Central Portal; it does NOT release to Maven Central. The
    # deployment waits at https://central.sonatype.com/publishing for a human to press
    # Publish, which is the intended shape: a released version is permanent.
    #
    # `publishAndReleaseToMavenCentral` is the task that would skip that gate. It is not
    # used here on purpose.
    #
    # Every credential arrives as an environment variable. Passing them as `-P` flags puts
    # them in the runner's process table and in the echoed `Run` line of the log.
    - name: Publish Maven
      env:
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      run: >-
        ./gradlew publishToMavenCentral
        -PreleaseVersion=${{ steps.version.outputs.version }}

    - name: GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >-
        gh release create "$GITHUB_REF_NAME"
        --draft
        --title "🎉 ${{ steps.version.outputs.version }} Release"
        build/libs/*.jar

    - name: Build Documentation
      run: ./gradlew dokkaGeneratePublicationHtml -PreleaseVersion=${{ steps.version.outputs.version }}

    - name: Publish Documentation
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        clean: false
        folder: build/javadoc
