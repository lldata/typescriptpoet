name: Publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+**"]

jobs:

  publish:
    runs-on: ubuntu-latest

    # Only the canonical repository holds the publishing secrets.
    if: github.repository == 'lldata/typescriptpoet'

    permissions:
      contents: write

    steps:

    - uses: actions/checkout@v5

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: gradle/actions/setup-gradle@v4

    - name: Resolve Version
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Build
      run: ./gradlew build -PreleaseVersion=${{ steps.version.outputs.version }}

    - name: Publish Maven
      env:
        ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.OSSRH_GPG_SECRET_KEY_ID }}
        ORG_GRADLE_PROJECT_signingKey: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
      run: >-
        ./gradlew publishMavenRelease
        -PreleaseVersion=${{ steps.version.outputs.version }}
        -PossrhUsername=${{ secrets.OSSRH_USER }}
        -PossrhPassword=${{ secrets.OSSRH_PASS }}

    - name: GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >-
        gh release create "$GITHUB_REF_NAME"
        --draft
        --title "🎉 ${{ steps.version.outputs.version }} Release"
        build/libs/*.jar

    - name: Build Documentation
      run: ./gradlew dokkaGeneratePublicationHtml -PreleaseVersion=${{ steps.version.outputs.version }}

    - name: Publish Documentation
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        clean: false
        folder: build/javadoc
