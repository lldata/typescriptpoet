name: Publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+**"]

jobs:

  publish:
    runs-on: ubuntu-latest

    # Only the canonical repository holds the publishing secrets.
    if: github.repository == 'lldata/typescriptpoet'

    permissions:
      contents: write

    steps:

    - uses: actions/checkout@v7

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: gradle/actions/setup-gradle@v6

    - name: Resolve Version
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Build
      run: ./gradlew build -PreleaseVersion=${{ steps.version.outputs.version }}

    # Uploads a bundle to the Central Portal; it does NOT release to Maven Central. The
    # deployment waits at https://central.sonatype.com/publishing for a human to press
    # Publish, which is the intended shape: a released version is permanent.
    #
    # `publishAndReleaseToMavenCentral` is the task that would skip that gate. It is not
    # used here on purpose.
    #
    # Every credential arrives as an environment variable. Passing them as `-P` flags puts
    # them in the runner's process table and in the echoed `Run` line of the log.
    - name: Publish Maven
      env:
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      run: |
        set -o pipefail
        ./gradlew publishToMavenCentral \
          -PreleaseVersion=${{ steps.version.outputs.version }} | tee publish.log

    # The upload reports success as soon as the Portal accepts the bundle, before it has
    # validated it. Without this step a green run says nothing about whether the deployment
    # is releasable, which is the question the run exists to answer.
    - name: Report Deployment Status
      env:
        USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      run: |
        id=$(sed -n 's/.*deployment id: \([0-9a-f-]*\).*/\1/p' publish.log | head -1)
        if [ -z "$id" ]; then
          echo "The publish step reported no deployment id."
          exit 1
        fi

        token=$(printf '%s:%s' "$USERNAME" "$PASSWORD" | base64 -w0)
        # Derived from two secrets, so it is not masked automatically.
        echo "::add-mask::$token"

        status() {
          curl -sS -X POST -H "Authorization: Bearer $token" \
            "https://central.sonatype.com/api/v1/publisher/status?id=$id"
        }

        for _ in $(seq 1 20); do
          state=$(status | python3 -c 'import json,sys; print(json.load(sys.stdin).get("deploymentState",""))')
          echo "deployment $id: ${state:-unknown}"
          case "$state" in
            VALIDATED|PUBLISHED)
              echo "::notice::Deployment $state — publish it at https://central.sonatype.com/publishing"
              exit 0
              ;;
            FAILED)
              echo "::error::Deployment failed validation."
              status
              exit 1
              ;;
          esac
          sleep 15
        done

        echo "::warning::Still ${state:-unknown} after five minutes; check the Portal."

    - name: GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >-
        gh release create "$GITHUB_REF_NAME"
        --draft
        --title "🎉 ${{ steps.version.outputs.version }} Release"
        build/libs/*.jar

    - name: Build Documentation
      run: ./gradlew dokkaGeneratePublicationHtml -PreleaseVersion=${{ steps.version.outputs.version }}

    # Dokka writes into a per-version directory, so without this the branch root has no
    # index and every link to the documentation has to name a version that will be stale
    # by the next release. This redirect is what lets the README point at a bare URL.
    - name: Point the Documentation Root at This Release
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        cat > build/javadoc/index.html <<HTML
        <!doctype html>
        <meta charset="utf-8">
        <title>TypeScriptPoet API documentation</title>
        <meta http-equiv="refresh" content="0; url=./$VERSION/">
        <link rel="canonical" href="./$VERSION/">
        <p>Redirecting to the
          <a href="./$VERSION/">TypeScriptPoet $VERSION API documentation</a>.</p>
        HTML

    - name: Publish Documentation
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        clean: false
        folder: build/javadoc
