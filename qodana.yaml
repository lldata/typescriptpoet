# IntelliJ inspections -- the analyser behind the warnings the IDE shows, which neither the
# Kotlin CLI compiler nor detekt reports.
version: "1.0"
linter: jetbrains/qodana-jvm-community:2026.2

profile:
  name: qodana.recommended

bootstrap: ./gradlew classes testClasses

exclude:
  - name: All
    paths:
      - build
      - .gradle

  # This is a library: almost its entire public API is unused *within* the repository and
  # called only by consumers. UnusedSymbol reported 67 findings, among them TypeName.STRING_CLASS,
  # FileSpec.writeTo and most of the builder methods -- all of them API we ship on purpose.
  # Acting on it would mean deleting the library. Dead *private* code is still caught, by
  # detekt's UnusedPrivateProperty, which is how EnumSpec.hasNoBody was found.
  - name: UnusedSymbol

  # The regexes in SymbolSpec are built by interpolating named sub-patterns into each other,
  # where the non-capturing groups keep the composition unambiguous rather than being noise.
  - name: RegExpUnnecessaryNonCapturingGroup
    paths:
      - src/main/kotlin/dk/lldata/typescriptpoet/SymbolSpec.kt
